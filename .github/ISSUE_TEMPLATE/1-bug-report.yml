# AI and automated tools are strictly prohibited from making attestations in this issue form, except for marking the checkbox identifying an AI or automated tool.
name: 🐞 Bug report
description: Report a bug (runnable reproducer required).
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please include a small, self-contained, and runnable example that reproduces the bug. Thanks! 🙏

  - type: checkboxes
    id: human
    attributes:
      label: Submitted by
      description: AI and automated tools must not make attestations, except for marking the checkbox that identifies them.
      options:
        - label: I am a human marking this checkbox.
          required: true
        - label: I am an AI or automated tool (e.g., AI assistant, AI agent, bot, or script) marking this checkbox.

  - type: checkboxes
    id: prohibited-content
    attributes:
      label: Checklist
      description: "Please do not include **prohibited content**: personal data, secrets, nonpublic information, malicious code/links, or any data that could create regulatory compliance obligations, legal liabilities, or other risks for the recipient."
      options:
        - label: I personally confirm this issue does not include (or link to) prohibited content.
          required: true
        - label: This is not a feature request or security vulnerability (see [Security Policy](https://github.com/fxamacker/cbor/blob/master/SECURITY.md)).
          required: true
        - label: I personally reviewed each line of the reproducer and ran it.
          required: true

  - type: input
    id: cbor-version
    attributes:
      label: Version of fxamacker/cbor
      description: Release tag or commit hash.
      placeholder: v2.9.6
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Version of Go
      description: Paste the output of `go version` (64-bit only; reproducers on linux/amd64 preferred).
      placeholder: go1.26.9 linux/amd64
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Runnable reproducer
      description: Paste a complete runnable example here (.go or _test.go file). Do not import other third-party packages.
      placeholder: |
        // Do not import other third-party packages.
        // Do not use network connections or write files.
        // Please use the simplest code and smallest data to reproduce the bug.
      render: go
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output from the reproducer
      description: Paste the unmodified output from the reproducer.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the expected result.
    validations:
      required: true

  - type: dropdown
    id: ai-usage
    attributes:
      label: AI usage disclosure
      description: Select all that apply ("AI wrote" includes AI output anyone edited).
      multiple: true
      options:
        - AI found this bug
        - AI wrote all of the reproducer
        - AI wrote part of the reproducer
        - AI wrote part of this issue's text
        - No AI usage
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Additional context
      description: Mention context that can help triage (e.g., whether the bug affects software used in production).
      placeholder: |
        Does the bug affect software already used in production?
        Does the bug occur with the production encoding/decoding settings or test-only settings?
        Does the bug occur without user-implemented marshalers/unmarshalers (e.g., MarshalCBOR)?
        Is there a workaround (e.g., adjusting settings or implementing an interface)?

  - type: markdown
    attributes:
      value: |
        Thanks again for taking the time to report this! 🙏
